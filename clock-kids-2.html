<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلم الساعة مع بنبن! 🐻</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #87CEEB;
    --yellow: #FFD93D;
    --orange: #FF6B35;
    --pink: #FF6B9D;
    --purple: #C77DFF;
    --green: #06D6A0;
    --blue: #4CC9F0;
    --red: #FF4D6D;
    --white: #FFFEF7;
    --dark: #2D2D2D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating stars background */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    font-size: 20px;
    animation: starFloat linear infinite;
    opacity: 0.6;
  }

  @keyframes starFloat {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* HEADER */
  .header {
    text-align: center;
    animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(36px, 8vw, 64px);
    color: var(--white);
    text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    line-height: 1.1;
  }

  .header .mascot {
    font-size: 60px;
    display: block;
    animation: mascotBounce 2s ease-in-out infinite;
  }

  @keyframes mascotBounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  /* SCORE BAR */
  .score-bar {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }

  .score-card {
    background: white;
    border-radius: 20px;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    font-size: 18px;
    font-weight: 900;
    color: var(--dark);
    animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s both;
  }

  .score-card .icon { font-size: 28px; }
  .score-card .val { color: var(--orange); font-size: 24px; }

  /* CLOCK CARD */
  .clock-card {
    background: white;
    border-radius: 40px;
    padding: 32px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s both;
    text-align: center;
  }

  .question-text {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 900;
    color: var(--dark);
    margin-bottom: 24px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* CLOCK */
  .clock-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    position: relative;
  }

  .clock-face {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff9f0, #fff3e0);
    border: 8px solid var(--purple);
    position: relative;
    box-shadow: 
      0 0 0 4px white,
      0 0 0 8px var(--pink),
      0 20px 60px rgba(199,125,255,0.3);
    cursor: pointer;
  }

  /* Numbers */
  .clock-num {
    position: absolute;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: var(--dark);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: 50% 50%;
  }

  /* Center dot */
  .clock-center {
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--dark);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 0 0 3px white;
  }

  /* Hands */
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 10px;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hour-hand {
    width: 8px;
    height: 65px;
    background: linear-gradient(to top, var(--dark), #555);
    margin-left: -4px;
    border-radius: 8px 8px 4px 4px;
    z-index: 3;
  }

  .minute-hand {
    width: 5px;
    height: 85px;
    background: linear-gradient(to top, var(--purple), var(--pink));
    margin-left: -2.5px;
    border-radius: 5px 5px 3px 3px;
    z-index: 4;
  }

  /* Tick marks */
  .tick {
    position: absolute;
    background: var(--purple);
    width: 3px;
    border-radius: 2px;
    top: 8px;
    left: 50%;
    transform-origin: bottom center;
    opacity: 0.4;
  }

  /* INTERACTIVE MODE */
  .clock-face.interactive {
    cursor: grab;
  }

  .clock-face.interactive:active { cursor: grabbing; }

  /* ANSWERS */
  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .ans-btn {
    background: linear-gradient(135deg, #f8f9ff, #eef0ff);
    border: 3px solid #e0e4ff;
    border-radius: 20px;
    padding: 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 900;
    color: var(--dark);
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .ans-btn:hover {
    transform: scale(1.05) translateY(-3px);
    border-color: var(--purple);
    box-shadow: 0 8px 24px rgba(199,125,255,0.3);
    background: linear-gradient(135deg, #f0f0ff, #e8e0ff);
  }

  .ans-btn:active { transform: scale(0.95); }

  .ans-btn.correct {
    background: linear-gradient(135deg, #06D6A0, #00b386);
    border-color: #06D6A0;
    color: white;
    animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .ans-btn.wrong {
    background: linear-gradient(135deg, #FF4D6D, #cc3d57);
    border-color: #FF4D6D;
    color: white;
    animation: shake 0.4s ease;
  }

  @keyframes correctPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* GAME MODES */
  .modes {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.5s both;
  }

  .mode-btn {
    background: white;
    border: none;
    border-radius: 20px;
    padding: 14px 24px;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    color: var(--dark);
  }

  .mode-btn:hover { transform: translateY(-4px) scale(1.05); }
  .mode-btn:active { transform: scale(0.95); }

  .mode-btn.active {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
    box-shadow: 0 8px 24px rgba(199,125,255,0.4);
    transform: translateY(-4px);
  }

  /* FREE PLAY CLOCK */
  .free-play-card {
    background: white;
    border-radius: 40px;
    padding: 32px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    text-align: center;
    animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .free-play-card h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: var(--dark);
    margin-bottom: 8px;
  }

  .time-display {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: var(--purple);
    margin: 16px 0;
    text-shadow: 2px 2px 0 rgba(199,125,255,0.3);
  }

  .time-words {
    font-size: 20px;
    font-weight: 700;
    color: var(--dark);
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border-radius: 16px;
    padding: 12px 20px;
    margin: 12px auto;
    max-width: 300px;
  }

  /* TIME CONTROLS */
  .time-controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .time-ctrl {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .time-ctrl label {
    font-size: 14px;
    font-weight: 700;
    color: var(--dark);
    opacity: 0.7;
  }

  .ctrl-btns {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
    font-weight: 900;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ctrl-btn.plus { background: linear-gradient(135deg, var(--green), #00b386); color: white; }
  .ctrl-btn.minus { background: linear-gradient(135deg, var(--orange), #e55a2b); color: white; }
  .ctrl-btn:hover { transform: scale(1.2); }
  .ctrl-btn:active { transform: scale(0.9); }

  .ctrl-val {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: var(--dark);
    min-width: 50px;
    text-align: center;
  }

  /* CELEBRATION */
  .celebration {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .celebration.show { opacity: 1; pointer-events: all; }

  .celebration-inner {
    background: white;
    border-radius: 40px;
    padding: 48px;
    text-align: center;
    box-shadow: 0 40px 80px rgba(0,0,0,0.3);
    animation: celebPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 380px;
    width: 90%;
  }

  @keyframes celebPop {
    from { transform: scale(0) rotate(-10deg); }
    to { transform: scale(1) rotate(0); }
  }

  .celebration-emoji { font-size: 80px; display: block; margin-bottom: 16px; animation: mascotBounce 0.6s ease-in-out infinite; }
  .celebration h2 { font-family: 'Fredoka One', cursive; font-size: 40px; color: var(--dark); margin-bottom: 8px; }
  .celebration p { font-size: 18px; color: #666; margin-bottom: 24px; }

  .next-btn {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
    border: none;
    border-radius: 20px;
    padding: 16px 40px;
    font-family: 'Tajawal', sans-serif;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.3s;
    pointer-events: all;
  }

  .next-btn:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(199,125,255,0.4); }

  /* CONFETTI */
  .confetti-piece {
    position: fixed;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 99;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* PROGRESS */
  .progress-wrap {
    width: 100%;
    background: rgba(255,255,255,0.3);
    border-radius: 20px;
    height: 16px;
    overflow: hidden;
    animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.4s both;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    border-radius: 20px;
    transition: width 0.5s ease;
    box-shadow: 0 0 10px rgba(255,107,53,0.5);
  }

  /* LEVEL BADGE */
  .level-badge {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    color: white;
    border-radius: 20px;
    padding: 8px 20px;
    font-weight: 900;
    font-size: 16px;
    display: inline-block;
    box-shadow: 0 4px 12px rgba(255,107,53,0.3);
    margin-bottom: 8px;
  }

  @keyframes bounceIn {
    from { opacity: 0; transform: scale(0.3) translateY(40px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* FEEDBACK */
  .feedback {
    font-size: 20px;
    font-weight: 900;
    min-height: 36px;
    margin: 8px 0;
    transition: all 0.3s;
    color: var(--dark);
  }

  .feedback.correct { color: var(--green); }
  .feedback.wrong { color: var(--red); }

  /* Responsive */
  @media (max-width: 500px) {
    .clock-face { width: 180px; height: 180px; }
    .hour-hand { height: 50px; }
    .minute-hand { height: 68px; }
    .answers-grid { grid-template-columns: 1fr 1fr; }
    .ans-btn { font-size: 15px; padding: 12px 8px; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- CELEBRATION -->
<div class="celebration" id="celebration">
  <div class="celebration-inner">
    <span class="celebration-emoji" id="celebEmoji">🌟</span>
    <h2 id="celebTitle">رائع!</h2>
    <p id="celebMsg">أحسنت يا بطل!</p>
    <button class="next-btn" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>
</div>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <span class="mascot">🐻</span>
    <h1>تعلم الساعة مع بنبن!</h1>
  </div>

  <!-- SCORE -->
  <div class="score-bar">
    <div class="score-card">
      <span class="icon">⭐</span>
      <span>النقاط:</span>
      <span class="val" id="scoreVal">0</span>
    </div>
    <div class="score-card">
      <span class="icon">🔥</span>
      <span>متتالية:</span>
      <span class="val" id="streakVal">0</span>
    </div>
    <div class="score-card">
      <span class="icon">🏆</span>
      <span>المستوى:</span>
      <span class="val" id="levelVal">1</span>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
  </div>

  <!-- MODES -->
  <div class="modes">
    <button class="mode-btn active" onclick="setMode('quiz')" id="modeQuiz">🎮 اختبار</button>
    <button class="mode-btn" onclick="setMode('free')" id="modeFree">⌚ تدريب حر</button>
    <button class="mode-btn" onclick="setMode('match')" id="modeMatch">🔗 وصل الساعة</button>
  </div>

  <!-- QUIZ MODE -->
  <div id="quizSection" class="clock-card">
    <div class="level-badge" id="levelBadge">المستوى 1 — ساعات كاملة</div>
    <div class="question-text" id="questionText">كم الساعة الآن؟</div>
    <div class="clock-wrap">
      <div class="clock-face" id="quizClock">
        <div class="hour-hand hand" id="quizHour" style="transform: rotate(0deg)"></div>
        <div class="minute-hand hand" id="quizMinute" style="transform: rotate(0deg)"></div>
        <div class="clock-center"></div>
      </div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="answers-grid" id="answersGrid"></div>
  </div>

  <!-- FREE PLAY MODE -->
  <div id="freeSection" class="free-play-card" style="display:none">
    <h2>⌚ تدريب حر</h2>
    <p style="color:#888; margin-bottom:16px;">حرك عقارب الساعة كما تريد!</p>
    <div class="clock-wrap">
      <div class="clock-face interactive" id="freeClock">
        <div class="hour-hand hand" id="freeHour" style="transform: rotate(0deg)"></div>
        <div class="minute-hand hand" id="freeMinute" style="transform: rotate(0deg)"></div>
        <div class="clock-center"></div>
      </div>
    </div>
    <div class="time-display" id="freeTimeDisplay">12:00</div>
    <div class="time-words" id="freeTimeWords">الساعة الثانية عشرة تماماً</div>
    <div class="time-controls">
      <div class="time-ctrl">
        <label>الساعات</label>
        <div class="ctrl-btns">
          <button class="ctrl-btn minus" onclick="changeTime('h', -1)">−</button>
          <span class="ctrl-val" id="hVal">12</span>
          <button class="ctrl-btn plus" onclick="changeTime('h', 1)">+</button>
        </div>
      </div>
      <div class="time-ctrl">
        <label>الدقائق</label>
        <div class="ctrl-btns">
          <button class="ctrl-btn minus" onclick="changeTime('m', -5)">−</button>
          <span class="ctrl-val" id="mVal">00</span>
          <button class="ctrl-btn plus" onclick="changeTime('m', 5)">+</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MATCH MODE -->
  <div id="matchSection" style="display:none; width:100%">
    <div class="clock-card">
      <div class="level-badge">وصّل الساعة بالوقت الصحيح!</div>
      <div class="question-text" id="matchQuestion">اسحب الوقت الصحيح للساعة</div>
      <div class="clock-wrap">
        <div class="clock-face" id="matchClock">
          <div class="hour-hand hand" id="matchHour"></div>
          <div class="minute-hand hand" id="matchMinute"></div>
          <div class="clock-center"></div>
        </div>
      </div>
      <div class="answers-grid" id="matchAnswers"></div>
    </div>
  </div>

</div>

<script>
// ===== FLOATING STARS =====
const emojis = ['⭐','🌟','✨','💫','🎈','🎀','🌈','🦋','🌸','❤️'];
const starsDiv = document.getElementById('stars');
for(let i = 0; i < 15; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  s.style.left = Math.random() * 100 + 'vw';
  s.style.fontSize = (14 + Math.random() * 20) + 'px';
  s.style.animationDuration = (8 + Math.random() * 12) + 's';
  s.style.animationDelay = (Math.random() * 10) + 's';
  starsDiv.appendChild(s);
}

// ===== DRAW CLOCK NUMBERS =====
function drawClockNumbers(clockEl) {
  for(let i = 1; i <= 12; i++) {
    const num = document.createElement('div');
    num.className = 'clock-num';
    const angle = (i * 30 - 90) * Math.PI / 180;
    const r = clockEl.offsetWidth/2 - 24;
    const cx = clockEl.offsetWidth/2;
    const cy = clockEl.offsetHeight/2;
    num.textContent = i;
    num.style.left = (cx + r * Math.cos(angle) - 16) + 'px';
    num.style.top = (cy + r * Math.sin(angle) - 16) + 'px';
    clockEl.appendChild(num);
  }
  // tick marks
  for(let i = 0; i < 60; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    const isMajor = i % 5 === 0;
    tick.style.height = isMajor ? '14px' : '8px';
    tick.style.opacity = isMajor ? '0.5' : '0.2';
    tick.style.width = isMajor ? '3px' : '2px';
    tick.style.marginLeft = isMajor ? '-1.5px' : '-1px';
    const angle = i * 6;
    const r = clockEl.offsetWidth/2 - 10;
    tick.style.transformOrigin = `50% ${r - 2}px`;
    tick.style.transform = `rotate(${angle}deg) translateY(-${r - (isMajor?8:4)}px)`;
    tick.style.top = '50%';
    tick.style.left = '50%';
    clockEl.appendChild(tick);
  }
}

window.addEventListener('load', () => {
  ['quizClock','freeClock','matchClock'].forEach(id => {
    const el = document.getElementById(id);
    if(el) drawClockNumbers(el);
  });
  newQuestion();
  updateFreeClock();
});

// ===== GAME STATE =====
let score = 0, streak = 0, level = 1, questionsAnswered = 0;
let currentAnswer = '';
let currentMode = 'quiz';

const levels = [
  { name: 'ساعات كاملة', minutes: [0] },
  { name: 'النصف والربع', minutes: [0, 30] },
  { name: 'كل خمس دقائق', minutes: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55] },
  { name: 'دقائق متقدمة', minutes: [0,5,10,15,20,25,30,35,40,45,50,55] }
];

const arabicHours = ['','الواحدة','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة','الحادية عشرة','الثانية عشرة'];
const arabicMins = { 0:'تماماً', 5:'وخمس دقائق', 10:'وعشر دقائق', 15:'والربع', 20:'وعشرون دقيقة', 25:'وخمس وعشرون دقيقة', 30:'والنصف', 35:'وخمس وثلاثون دقيقة', 40:'وأربعون دقيقة', 45:'وثلاثة أرباع', 50:'وخمسون دقيقة', 55:'وخمس وخمسون دقيقة' };

function timeToArabic(h, m) {
  const hStr = arabicHours[h] || arabicHours[12];
  const mStr = arabicMins[m] || `و${m} دقيقة`;
  return `الساعة ${hStr} ${mStr}`;
}

function setHands(hourEl, minEl, h, m) {
  const hDeg = (h % 12) * 30 + m * 0.5;
  const mDeg = m * 6;
  hourEl.style.transform = `rotate(${hDeg}deg)`;
  minEl.style.transform = `rotate(${mDeg}deg)`;
}

function newQuestion() {
  const lv = levels[Math.min(level-1, levels.length-1)];
  const allowedMins = lv.minutes;
  const h = Math.floor(Math.random() * 12) + 1;
  const m = allowedMins[Math.floor(Math.random() * allowedMins.length)];
  currentAnswer = `${h}:${m.toString().padStart(2,'0')}`;

  setHands(document.getElementById('quizHour'), document.getElementById('quizMinute'), h, m);
  document.getElementById('levelBadge').textContent = `المستوى ${level} — ${lv.name}`;

  // Generate wrong answers
  const answers = [currentAnswer];
  while(answers.length < 4) {
    const fh = Math.floor(Math.random() * 12) + 1;
    const fm = allowedMins[Math.floor(Math.random() * allowedMins.length)];
    const fa = `${fh}:${fm.toString().padStart(2,'0')}`;
    if(!answers.includes(fa)) answers.push(fa);
  }

  // Shuffle
  answers.sort(() => Math.random() - 0.5);

  const grid = document.getElementById('answersGrid');
  grid.innerHTML = '';
  answers.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    const [ah, am] = a.split(':').map(Number);
    btn.innerHTML = `<div style="font-size:22px">${a}</div><div style="font-size:13px;opacity:0.6;margin-top:4px">${timeToArabic(ah, am)}</div>`;
    btn.onclick = () => checkAnswer(a, btn);
    grid.appendChild(btn);
  });

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('questionText').textContent = '🤔 كم الساعة الآن؟';
}

function checkAnswer(ans, btn) {
  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b => b.onclick = null);

  if(ans === currentAnswer) {
    btn.classList.add('correct');
    score += (streak >= 3 ? 20 : 10);
    streak++;
    questionsAnswered++;
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('streakVal').textContent = streak;
    document.getElementById('feedback').textContent = streak >= 3 ? `🔥 ${streak} صح متتالية!` : '✅ أحسنت!';
    document.getElementById('feedback').className = 'feedback correct';

    // Level up every 5 correct
    if(questionsAnswered % 5 === 0 && level < 4) {
      level++;
      document.getElementById('levelVal').textContent = level;
    }
    document.getElementById('progressBar').style.width = Math.min((questionsAnswered % 5) * 20, 100) + '%';

    showCelebration();
  } else {
    btn.classList.add('wrong');
    streak = 0;
    document.getElementById('streakVal').textContent = 0;
    document.getElementById('feedback').textContent = '❌ حاول مرة أخرى!';
    document.getElementById('feedback').className = 'feedback wrong';

    // Show correct answer
    allBtns.forEach(b => {
      const txt = b.querySelector('div').textContent;
      if(txt === currentAnswer) b.classList.add('correct');
    });
    setTimeout(nextQuestion, 2000);
  }
}

function showCelebration() {
  const msgs = [
    ['🌟', 'رائع!', 'أنت نجم حقيقي! ⭐'],
    ['🎉', 'ممتاز!', 'إجابة صحيحة! 🎊'],
    ['🏆', 'بطل!', 'أحسنت يا ذكي! 🧠'],
    ['🦁', 'قوي!', 'مثل الأسد! 💪'],
    ['🌈', 'جميل!', 'تعلمت الساعة! ⌚'],
  ];
  const [e, t, m] = msgs[Math.floor(Math.random() * msgs.length)];
  document.getElementById('celebEmoji').textContent = e;
  document.getElementById('celebTitle').textContent = t;
  document.getElementById('celebMsg').textContent = m;
  document.getElementById('celebration').classList.add('show');
  spawnConfetti();
}

function nextQuestion() {
  document.getElementById('celebration').classList.remove('show');
  newQuestion();
}

function spawnConfetti() {
  const colors = ['#FFD93D','#FF6B35','#FF6B9D','#C77DFF','#06D6A0','#4CC9F0'];
  for(let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// ===== FREE PLAY =====
let freeH = 12, freeM = 0;

function changeTime(type, val) {
  if(type === 'h') {
    freeH = ((freeH - 1 + val + 12) % 12) + 1;
    document.getElementById('hVal').textContent = freeH;
  } else {
    freeM = ((freeM + val) + 60) % 60;
    document.getElementById('mVal').textContent = freeM.toString().padStart(2,'0');
  }
  updateFreeClock();
}

function updateFreeClock() {
  setHands(document.getElementById('freeHour'), document.getElementById('freeMinute'), freeH, freeM);
  document.getElementById('freeTimeDisplay').textContent = `${freeH}:${freeM.toString().padStart(2,'0')}`;
  document.getElementById('freeTimeWords').textContent = timeToArabic(freeH, freeM);
}

// ===== MATCH MODE =====
function newMatchQuestion() {
  const h = Math.floor(Math.random() * 12) + 1;
  const allowedMins = [0, 15, 30, 45];
  const m = allowedMins[Math.floor(Math.random() * allowedMins.length)];
  currentAnswer = `${h}:${m.toString().padStart(2,'0')}`;
  setHands(document.getElementById('matchHour'), document.getElementById('matchMinute'), h, m);

  const answers = [currentAnswer];
  while(answers.length < 4) {
    const fh = Math.floor(Math.random() * 12) + 1;
    const fm = allowedMins[Math.floor(Math.random() * allowedMins.length)];
    const fa = `${fh}:${fm.toString().padStart(2,'0')}`;
    if(!answers.includes(fa)) answers.push(fa);
  }
  answers.sort(() => Math.random() - 0.5);

  const grid = document.getElementById('matchAnswers');
  grid.innerHTML = '';
  answers.forEach(a => {
    const [ah, am] = a.split(':').map(Number);
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerHTML = `<div>${timeToArabic(ah, am)}</div>`;
    btn.onclick = () => {
      if(a === currentAnswer) {
        btn.classList.add('correct');
        score += 15;
        streak++;
        document.getElementById('scoreVal').textContent = score;
        document.getElementById('streakVal').textContent = streak;
        showCelebration();
        document.getElementById('celebration').querySelector('.next-btn').onclick = () => {
          document.getElementById('celebration').classList.remove('show');
          newMatchQuestion();
        };
      } else {
        btn.classList.add('wrong');
        streak = 0;
        document.getElementById('streakVal').textContent = 0;
        setTimeout(newMatchQuestion, 1500);
      }
      grid.querySelectorAll('.ans-btn').forEach(b => b.onclick = null);
    };
    grid.appendChild(btn);
  });
}

// ===== MODE SWITCHING =====
function setMode(mode) {
  currentMode = mode;
  document.getElementById('quizSection').style.display = mode === 'quiz' ? 'block' : 'none';
  document.getElementById('freeSection').style.display = mode === 'free' ? 'block' : 'none';
  document.getElementById('matchSection').style.display = mode === 'match' ? 'block' : 'none';

  document.getElementById('modeQuiz').classList.toggle('active', mode === 'quiz');
  document.getElementById('modeFree').classList.toggle('active', mode === 'free');
  document.getElementById('modeMatch').classList.toggle('active', mode === 'match');

  if(mode === 'match') newMatchQuestion();
  if(mode === 'free') updateFreeClock();

  document.getElementById('celebration').querySelector('.next-btn').onclick = nextQuestion;
}
</script>
